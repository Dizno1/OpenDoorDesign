name: Community registration digest

on:
  schedule:
    # 8:17 AM New York during daylight saving time or standard time.
    - cron: '17 12,13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-registration-digest
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke Community registration digest
        env:
          ADMIN_USERNAME: ${{ secrets.COMMUNITY_ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.COMMUNITY_ADMIN_PASSWORD }}
          DIGEST_URL: https://community-api.opendoordesign.org/community/admin/digest/run
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ADMIN_USERNAME" || -z "$ADMIN_PASSWORD" ]]; then
            echo 'Missing COMMUNITY_ADMIN_USERNAME or COMMUNITY_ADMIN_PASSWORD secret.' >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 10 \
            --max-time 60 \
            --request POST \
            --basic --user "$ADMIN_USERNAME:$ADMIN_PASSWORD" \
            --header 'Accept: application/json' \
            "$DIGEST_URL"
